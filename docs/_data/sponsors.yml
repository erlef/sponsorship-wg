# Sponsor data for the home page.
#
# Schema for each entry:
#   name:     Display name (string, required)
#   url:      Sponsor's website (string, required)
#   logo:     File under /assets/images/sponsors/ (string, optional — falls back to text tile if missing)
#   page:     Internal landing page path, e.g. /sponsors/dashbit/ (string, optional).
#             When set, the tile links here instead of the external website.
#             Create the page as a Markdown file under docs/sponsors/ using layout: sponsor.
#   impact:   Impact level for the current-sponsors grid: "visionary" or "strategic"
#             (string, optional). Visionary logos render largest, strategic medium.
#             Omit for the standard grid.
#   note:     Short attribution shown under the logo on the tile (string, optional) —
#             e.g. the project their sponsorship supports. Used on impact tiers.

